name: Build and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Test backend
        env:
          DEV_MODE: "true"
        run: python -m pytest backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile.prod \
            --tag "familytreepy:${{ github.sha }}" \
            --build-arg APP_REVISION="${{ github.sha }}" \
            --build-arg APP_BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg NEXT_PUBLIC_AZURE_AD_CLIENT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_AZURE_AD_TENANT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}" \
            .

  deploy:
    name: Deploy production
    if: vars.DEPLOYMENT_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Azure Container Registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          current_image="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"

          registry_server="${current_image%%/*}"
          if [[ -z "$registry_server" || "$registry_server" == "$current_image" || "$registry_server" != *.azurecr.io ]]; then
            echo "::error::The Container App does not currently use an Azure Container Registry image."
            exit 1
          fi

          acr_name="${registry_server%%.*}"
          echo "server=$registry_server" >> "$GITHUB_OUTPUT"
          echo "name=$acr_name" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.registry.outputs.name }}"
          image="${{ steps.registry.outputs.server }}/familytreepy:${{ github.sha }}"
          docker build \
            --file Dockerfile.prod \
            --tag "$image" \
            --build-arg APP_REVISION="${{ github.sha }}" \
            --build-arg APP_BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg NEXT_PUBLIC_AZURE_AD_CLIENT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_AZURE_AD_TENANT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}" \
            .
          docker push "$image"

      - name: Deploy Container App revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          image="${{ steps.registry.outputs.server }}/familytreepy:${{ github.sha }}"
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --image "$image" \
            --output none

          fqdn="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)"
          if [[ -z "$fqdn" ]]; then
            echo "::error::The Container App has no external ingress FQDN."
            exit 1
          fi
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Check deployed application
        shell: bash
        run: |
          set -euo pipefail
          health_url="${{ steps.deploy.outputs.url }}/api/health"
          expected_revision="${{ github.sha }}"
          deployed_revision=""
          for attempt in {1..12}; do
            if response="$(curl --fail --silent --show-error --max-time 15 "$health_url")"; then
              deployed_revision="$(python -c \
                'import json, sys; print(json.load(sys.stdin).get("revision", ""))' \
                <<< "$response")"
              if [[ "$deployed_revision" == "$expected_revision" ]]; then
                echo "$response"
                echo "Verified deployed revision $deployed_revision"
                exit 0
              fi
              echo "Attempt $attempt: expected revision $expected_revision, received ${deployed_revision:-<missing>}"
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::The deployed application at $health_url reported revision ${deployed_revision:-<missing>}, expected $expected_revision"
              exit 1
            fi
            sleep 10
          done
